name: Marvel Rivals Official Data Auto-Sync

on:
  schedule:
    # 매일 UTC 00:00 (한국 시간 오전 9시)에 공식 홈페이지 확인
    - cron: '0 0 * * *'
  # GitHub 웹사이트 Actions 탭에서 수동 1클릭 실행 가능
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-data-sync
  cancel-in-progress: false

jobs:
  sync-marvel-rivals:
    name: Sync Official Patch & Heroes Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. 공식 홈페이지에서 최신 영웅 및 스킬 수치 데이터 크롤링
      - name: Fetch Official NetEase Data
        run: python scripts/sync_heroes.py

      # 2. 데드풀 3역할 분리, 멀티 폼 동적 구성, 번역 주입 및 캐시 해시 동기화
      - name: Post-Process Hero Data & Cache Hash
        run: node scripts/post_process.js

      # 3. 경량 스탯 다국어 런타임 번들 빌드
      - name: Build Runtime Stat Translations Bundle
        run: python scripts/build_unified_translations.py

      # 4. 다국어(KR/JP) 번역, 스키마, 이미지 URL 및 프론트엔드 통합 검증
      - name: Validate Translations & Purity
        run: node scripts/validate_translations.js

      - name: Validate Hero Schema & Base Stats
        run: python scripts/validate_heroes.py

      - name: Test Frontend Integration
        run: node scripts/test_integration.js

      - name: Verify Official Image URLs
        run: python scripts/check_images.py

      # 5. 데이터/문서 변경 사항 감지 및 자동 커밋 & 푸시
      - name: Commit and Push if Changes Detected
        run: |
          git config --global user.name "MarvelRivals-SyncBot"
          git config --global user.email "sync-bot@marvelrivals.local"

          git add data/heroes.json data/translations.json index.html README.md

          if git diff --staged --quiet; then
            echo "✅ 최신 상태입니다. (새로운 패치 또는 변경사항 없음)"
          else
            echo "🚀 공식 홈페이지의 새로운 패치/영웅 업데이트가 감지되었습니다! 자동 커밋 및 배포를 진행합니다."
            git commit -m "Auto-sync: Marvel Rivals official patch update & hero stats sync"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "🎉 배포 성공!"
          fi
